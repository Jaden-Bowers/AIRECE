name: native-ci

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Require pinned component sources
        shell: pwsh
        run: |
          foreach ($component in 'xair','xair_cfg','xair_sym') {
            if (-not (Test-Path "vendor/$component/CMakeLists.txt")) {
              throw "vendor/$component is required in CI (initialize pinned submodules)"
            }
          }
      - run: cmake --preset windows-msvc
      - run: cmake --build --preset windows-msvc-release
      - run: ctest --preset windows-msvc-release
